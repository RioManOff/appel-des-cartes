name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re
          def get(u,n=0):
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30);b=r.read();return r.status,len(b),b
            except Exception as e:return str(e)[:60],0,b''
          for u in ['https://www.dbs-cardgame.com/images/cardlist/cardimg/BT1-001.png','https://www.dbs-cardgame.com/images/cardlist/cardimg/BT1-001_b.png',
                    'https://www.dbs-cardgame.com/images/cardlist/cardimg/BT25-001_SPR.png','https://www.dbs-cardgame.com/images/cardlist/cardimg/BT25-001_SLR.png','https://www.dbs-cardgame.com/images/cardlist/cardimg/BT25-001_SLR_b.png',
                    'https://www.dbs-cardgame.com/fw/images/cards/card/en/FB01-001.webp','https://www.dbs-cardgame.com/fw/images/cards/card/en/FB01-001_b.webp','https://www.dbs-cardgame.com/fw/images/cards/card/en/FB01-001_f.webp',
                    'https://www.dbs-cardgame.com/fw/images/cards/card/ja/FB01-001_f.webp','https://www.dbs-cardgame.com/fw/images/cards/card/ja/FB01-001_b.webp','https://www.dbs-cardgame.com/fw/images/cards/card/en/FB01-001_p1_f.webp','https://www.dbs-cardgame.com/fw/images/cards/card/en/FB01-001_p1_b.webp']:
            s,n,_=get(u);print(s,n,u)
          for u in ['https://www.dbs-cardgame.com/fw/en/cardlist/?search=true&q=FB01-001','https://www.dbs-cardgame.com/us-en/cardlist/?search=true&q=BT25-001','https://www.dbs-cardgame.com/us-en/cardlist/?search=true&category=428025']:
            s,n,b=get(u);t=b.decode('utf-8','ignore');print('PAGE',s,n,u)
            print(sorted(set(re.findall(r'(?:src|data-src)="([^"]*(?:cardimg|cards/card)[^"]*)"',t)))[:20])
          PY
