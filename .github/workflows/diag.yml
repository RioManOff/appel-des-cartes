name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import re,time,http.cookiejar,urllib.request
          cj=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj));op.addheaders=[('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36')]
          B='http://www.dbzcollection.fr/2v2/'
          def get(u):
            for k in range(3):
              try:return op.open(B+u,timeout=60).read().decode('latin-1')
              except Exception as e:time.sleep(3)
            return ''
          get('cartes.php?idc=99')
          t=get('cartes.php?idc=199&ids=740')
          print('XX len',len(t))
          print('XX',sorted(set(re.findall(r'href="([^"]*ids=740[^"]*)"',t))))
          print('XX',sorted(set(re.findall(r'(?:href|onclick)="([^"]*(?:page|deb|debut|start|suiv)[^"]*)"',t,re.I)))[:40])
          i=t.rfind('bloc_carte');print('XX',re.sub(r'\s+',' ',t[i:i+2500]))
          r=op.open(B+'cartes/199/910/h400_54293_carte.jpg',timeout=60);b=r.read();print('XX img',len(b),r.headers.get('Content-Type'))
          PY
