name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: pip install pillow >/dev/null
      - run: |
          cat > g.py <<'PY'
          import json,base64,io,urllib.request,sys,concurrent.futures as cf
          from PIL import Image
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30) as r:return r.read()
              except Exception as e:return None
          def enc(b,size,q):
              im=Image.open(io.BytesIO(b)).convert('RGB')
              if im.width>im.height:im=im.rotate(90,expand=True)
              im=im.resize(size,Image.LANCZOS);o=io.BytesIO();im.save(o,'WEBP',quality=q,method=6)
              return 'data:image/webp;base64,'+base64.b64encode(o.getvalue()).decode()
          out={}
          N={'DB1':103,'DB2':177,'DB3':144}
          for s,n in N.items():
              ids=['%s-%03d'%(s,i) for i in range(1,n+1)]
              with cf.ThreadPoolExecutor(8) as ex:
                  res=list(ex.map(lambda i:(i,get('https://www.dbs-cardgame.com/images/cardlist/cardimg/%s.png'%i)),ids))
              d={i:enc(b,(400,560),82) for i,b in res if b}
              miss=[i for i,b in res if not b]
              print('XXDB',s,len(d),'manquent',miss[:20])
              ks=sorted(d)
              if len(ks)>120:
                  h=(len(ks)+1)//2;json.dump({k:d[k] for k in ks[:h]},open('ms-hi-%s.json'%s,'w'));json.dump({k:d[k] for k in ks[h:]},open('ms-hi-%s-2.json'%s,'w'))
              else:json.dump(d,open('ms-hi-%s.json'%s,'w'))
          fw={'FB01-139_ALT2':'FB01-139_p2','FS03-15_ALT2':'FS03-15_p2','FS04-16_ALT2':'FS04-16_p2','FS05-16_ALT':'FS05-16_p1'}
          f={}
          for k,v in fw.items():
              b=get('https://www.dbs-cardgame.com/fw/images/cards/card/jp/%s.webp'%v) or get('https://www.dbs-cardgame.com/fw/images/cards/card/en/%s.webp'%v)
              if b:f[k]=enc(b,(260,363),80)
          print('XXFW',sorted(f));json.dump(f,open('fw-extra.json','w'))
          PY
          python3 g.py
          ls -la *.json | sed 's/^/XXF /'
      - uses: actions/upload-artifact@v4
        with:
          name: photos
          path: '*.json'
