name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.dbs-cardgame.com/fw/jp/cardlist/" "https://www.dbs-cardgame.com/fw/en/cardlist/" "https://www.dbs-cardgame.com/fw/fr/cardlist/"; do
            echo "XXURL $u"; curl -sL -A "Mozilla/5.0" "$u" -o p.html -w "XXCODE %{http_code} %{size_download}\n"
            python3 -c "
          import re,html
          s=open('p.html',encoding='utf-8',errors='replace').read()
          for v,t in re.findall(r'<option[^>]*value=\"(\d{6})\"[^>]*>(.*?)</option>',s,re.S):print('XX',v,html.unescape(re.sub(r'\s+',' ',re.sub('<[^>]+>','',t))).strip())
          for v,t in re.findall(r'data-val=\"(\d{6})\"[^>]*>(.*?)<',s,re.S)[:80]:print('XXD',v,html.unescape(t).strip())
          "
          done
