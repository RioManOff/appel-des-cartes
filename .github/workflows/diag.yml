name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          for b in tmp-bt32 tmp-bt32v tmp-cat tmp-cm tmp-decks tmp-dz tmp-em tmp-em2 tmp-img tmp-ns tmp-packs tmp-photos; do
            curl -s -o /dev/null -w "XX $b %{http_code}\n" -X DELETE -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/$b"
          done
