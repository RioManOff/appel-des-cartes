name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "dbs-cardgame.com/europe-fr/*" "dbs-cardgame.com/fr/*"; do
            curl -s -m 120 -w "\nCODE %{http_code}\n" "https://web.archive.org/cdx/search/cdx?url=$q&fl=original&collapse=urlkey&filter=original:.*card.*&limit=300" > o.txt || true
            sed 's/^/XX /' o.txt | head -200
          done
