name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://web.archive.org/cdx/search/cdx?url=dbs-cardgame.com/europe-fr/cardlist/*&output=txt&fl=original,timestamp&collapse=urlkey&limit=400" | sed 's/^/XX /' | head -300
          curl -s "https://web.archive.org/cdx/search/cdx?url=dbs-cardgame.com/fr/cardlist/*&output=txt&fl=original,timestamp&collapse=urlkey&limit=100" | sed 's/^/XY /' | head -100
