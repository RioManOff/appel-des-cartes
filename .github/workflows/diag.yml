name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re
          def h(u):
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30);return r.status,len(r.read())
            except Exception as e:return str(e)[:40],0
          B='https://www.dbs-cardgame.com/fw/images/cards/card/'
          for l in ['en','jp']:
            for c in ['E-01','E-01_f','E-01_p1','E01-01','E01-01_f','E-42','E-42_f','E-148_f','E-148']:
              print('XX',l,c,h(B+l+'/'+c+'.webp'))
          for u in ['https://www.dbs-cardgame.com/fw/en/cardlist/?search=true&q=Energy','https://www.dbs-cardgame.com/fw/en/cardlist/?search=true&category%5B%5D=583000']:
            try:
              t=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
              print('XX page',len(t),re.findall(r'E\d*-\d+[^"<]{0,20}',t)[:30])
              i=t.find('category');print('XX',re.findall(r'name="category\[\]" value="(\d+)"[^>]*>\s*<[^>]*>([^<]*)',t)[:40])
              print('XX opts',re.findall(r'<option value="(\d+)"[^>]*>([^<]{1,60})</option>',t)[:80])
            except Exception as e:print('XX err',e)
          PY
