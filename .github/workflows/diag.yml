name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,html
          B='https://downloads.s3.cardmarket.com/productCatalog/'
          P=json.loads(urllib.request.urlopen(urllib.request.Request(B+'productList/products_singles_13.json',headers={'User-Agent':'x'}),timeout=120).read())['products']
          G={g['idProduct']:g for g in json.loads(urllib.request.urlopen(urllib.request.Request(B+'priceGuide/price_guide_13.json',headers={'User-Agent':'x'}),timeout=120).read())['priceGuides']}
          print('XXN',len(P))
          for p in P:
            n=html.unescape(p.get('name',''))
            if 'Marker' in n or 'marker' in n or 'Shatterfoil' in n or ('God Rare' in n) or ('(BT7-131)' in n) or ('(BT18-147)' in n) or ('(BT25-14' in n):
              g=G.get(p['idProduct'],{})
              print('XXP',json.dumps([p['idProduct'],n,p.get('idExpansion'),g.get('trend'),g.get('avg30')],ensure_ascii=False))
          PY
