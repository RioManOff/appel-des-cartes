name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - run: pip install -q pillow
      - run: |
          python3 - <<'PY'
          import json,urllib.request,base64,io,os
          from PIL import Image
          M=json.loads('''{"BT32": [710674, 710675], "TB1": [162381, 162382], "TB2": [173548, 173547], "TB3": [180741, 180739], "MB": [248234, 248235], "BEB": [228920, 228919]}''')
          def get(pid):
            try:return urllib.request.urlopen(urllib.request.Request('https://tcgplayer-cdn.tcgplayer.com/product/%d_in_1000x1000.jpg'%pid,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
            except Exception as e:print('XXE',pid,e);return None
          def enc(b,h):
            im=Image.open(io.BytesIO(b)).convert('RGBA')
            # fond blanc -> transparent
            px=im.load();w,hh=im.size
            bb=im.getbbox();
            im2=Image.new('RGBA',im.size)
            data=[(r,g,bl,0) if r>245 and g>245 and bl>245 else (r,g,bl,a) for r,g,bl,a in im.getdata()]
            im2.putdata(data);bb=im2.getbbox() or (0,0,w,hh);im2=im2.crop(bb)
            ww=round(im2.width*h/im2.height);im2=im2.resize((ww,h),Image.LANCZOS);o=io.BytesIO();im2.save(o,'WEBP',quality=85)
            return 'data:image/webp;base64,'+base64.b64encode(o.getvalue()).decode()
          out={}
          for sid,(pk,bx) in M.items():
            a=get(pk);b=get(bx);out[sid]={}
            if a:out[sid]['pk']=enc(a,360)
            if b:out[sid]['box']=enc(b,300)
          os.makedirs('pub',exist_ok=True);json.dump(out,open('pub/packs.json','w'));print('XXOK',{k:list(v) for k,v in out.items()})
          PY
          cd pub && git init -q && git checkout -q -b tmp-packs && git add . && git -c user.name=bot -c user.email=bot@x commit -qm p && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-packs && echo XXPUSHED
