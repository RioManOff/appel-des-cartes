name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import re,json,time,http.cookiejar,urllib.request
          cj=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj));op.addheaders=[('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36')]
          B='http://www.dbzcollection.fr/2v2/'
          def get(u):
            for k in range(3):
              try:return op.open(B+u,timeout=60).read().decode('latin-1')
              except Exception as e:time.sleep(3)
            return ''
          R={}
          for u in ['cartes.php?idc=99','index.php','cartes.php','collections.php','cartes.php?cat=jp']:
            t=get(u);L=sorted(set((int(a),re.sub(r'\s+',' ',b).strip()) for a,b in re.findall(r'idc=(\d+)[^>]*>([^<]{2,80})<',t)))
            R[u]=L;print(u,len(t),len(L))
            for a,b in L:
              if re.search(r'hero|diver|h.ros',b,re.I):print('   ',a,b)
          for idc in [335]:
            t=get('cartes.php?idc=%d'%idc)
            L=[(m.group(1),re.sub(r'\s+',' ',m.group(2)).strip()) for m in re.finditer(r'idc=%d&(?:amp;)?ids=(\d+)[^>]*>([^<]{0,80})'%idc,t)]
            print('idc',idc,L)
          json.dump(R,open('dz_index.json','w'),ensure_ascii=False)
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dz_index.json && git commit -q -m idx && git push -q
