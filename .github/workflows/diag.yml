name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import re,json,time,http.cookiejar,urllib.request
          cj=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj));op.addheaders=[('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36')]
          B='http://www.dbzcollection.fr/2v2/'
          def get(u):
            for k in range(3):
              try:return op.open(B+u,timeout=60).read().decode('latin-1')
              except Exception as e:time.sleep(3)
            return ''
          get('cartes.php?idc=99')
          def parse(t):
            return [[m.group(1),m.group(3).strip(),m.group(2)] for m in re.finditer(r'<a name="c(\d+)"></a>\s*<div class="bc_cadre"[^>]*>\s*<div class="bc_cadre_numero" title="([^"]*)"[^>]*><div class="bc_texte_numero">([^<]*)</div>',t)]
          R=json.load(open('sb_numeros.json'))
          t=get('cartes.php?idc=53')
          sets=sorted(set(int(x) for x in re.findall(r'cartes\.php\?idc=53&(?:amp;)?ids=(\d+)',t)))
          print('LG sets',sets)
          for m in re.finditer(r'idc=53&(?:amp;)?ids=(\d+)[^>]*>([^<]{0,60})',t):print('  ',m.group(1),m.group(2).strip())
          for ids in sets:
            c=parse(get('cartes.php?idc=53&ids=%d'%ids));R['lg%d'%ids]=c;print('lg',ids,len(c),[x[1] for x in c][:60])
          for ids in [1202,1203,1204,1205,1206,1225]:
            c=parse(get('cartes.php?idc=292&ids=%d'%ids));R['p%d'%ids]=c;print('p',ids,len(c),[x[1] for x in c][:12])
          json.dump(R,open('sb_numeros.json','w'),ensure_ascii=False)
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sb_numeros.json && git commit -q -m sb2 && git push -q
