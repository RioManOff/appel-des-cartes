          import json,urllib.request,base64,io,os,collections
          from PIL import Image,ImageChops
          P=json.load(open('pick.json'));out=collections.defaultdict(dict);bad=[]
          for cid,pid in P['pick'].items():
            b=None
            for sz in ['in_1000x1000','in_400x400']:
              try:b=urllib.request.urlopen(urllib.request.Request('https://tcgplayer-cdn.tcgplayer.com/product/%d_%s.jpg'%(pid,sz),headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read();break
              except Exception as e:pass
            if not b:bad.append(cid);continue
            im=Image.open(io.BytesIO(b)).convert('RGB')
            bg=Image.new('RGB',im.size,im.getpixel((2,2)));diff=ImageChops.difference(im,bg).convert('L').point(lambda x:255 if x>24 else 0);bb=diff.getbbox()
            if bb:im=im.crop(bb)
            if im.width>im.height*1.05:im=im.rotate(90,expand=True)
            im=im.resize((400,560),Image.LANCZOS);o=io.BytesIO();im.save(o,'WEBP',quality=80)
            out[P['by'][cid]][cid]='data:image/webp;base64,'+base64.b64encode(o.getvalue()).decode()
          os.makedirs('pub',exist_ok=True)
          for s,dd in out.items():json.dump(dd,open('pub/msx-%s.json'%s,'w'),separators=(',',':'))
          print('XXN',sum(len(x) for x in out.values()),'XXBAD',bad)
