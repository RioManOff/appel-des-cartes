name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re,json,collections,html
          def get(u):
            try:
              return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read()
            except Exception as e:return 'ERR %s'%e
          for u in ['https://www.dbs-cardgame.com/fw/jp/images/cards/card/ST01-001_f.webp','https://www.dbs-cardgame.com/fw/images/cards/card/jp/ST01-001_f.webp','https://www.dbs-cardgame.com/fw/images/cards/card/ja/ST01-001_f.webp','https://www.dbs-cardgame.com/fw/images/cards/card/ja/FB01-001_f.webp','https://www.dbs-cardgame.com/fw/jp/images/cards/card/ja/ST01-001_f.webp','https://www.dbs-cardgame.com/fw/images/cards/card/jp/FS01-01_b_p1.webp']:
            b=get(u);print(u, len(b) if isinstance(b,bytes) else b)
          b=get('https://www.dbs-cardgame.com/fw/jp/cardlist/?search=true&q=ST01-001')
          if isinstance(b,bytes):
            t=b.decode('utf-8','ignore');print(sorted(set(re.findall(r'[^"\' ]*ST01-001[^"\' ]*',t)))[:20])
          else:print(b)
          B='https://downloads.s3.cardmarket.com/productCatalog/'
          P=json.loads(get(B+'productList/products_singles_13.json'))['products']
          G={g['idProduct']:g for g in json.loads(get(B+'priceGuide/price_guide_13.json'))['priceGuides']}
          ex=collections.defaultdict(list)
          for p in P:
            n=html.unescape(p.get('name',''))
            if re.search(r'\((ST01-|SB01-|SB02-|E-1[45]\d)',n):ex[p['idExpansion']].append((n,p['idProduct']))
          for e,l in sorted(ex.items()):
            print('EXT',e,len(l))
            for n,i in sorted(l)[:6]:print('   ',n,i,{k:G.get(i,{}).get(k) for k in ('trend','avg30','low')})
          for code in ['ST01-001','ST01-070','ST01-004','SB01-001','E-148']:
            print(code,[(e,n,i,G.get(i,{}).get('trend')) for e,l in ex.items() for n,i in l if '('+code+')' in n])
          PY
