name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - run: pip install -q pillow
      - run: |
          python3 - <<'PY'
          import json,urllib.request,base64,io,os
          from PIL import Image
          o={}
          for pid in (689063,675294,675317):
            try:
              b=urllib.request.urlopen(urllib.request.Request('https://tcgplayer-cdn.tcgplayer.com/product/%d_in_1000x1000.jpg'%pid,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
              im=Image.open(io.BytesIO(b)).convert('RGB')
              if im.width>im.height:im=im.rotate(90,expand=True)
              im=im.resize((400,560),Image.LANCZOS);x=io.BytesIO();im.save(x,'WEBP',quality=82,method=6)
              o[pid]='data:image/webp;base64,'+base64.b64encode(x.getvalue()).decode();print('XXOK',pid)
            except Exception as e:print('XXE',pid,e)
          os.makedirs('pub',exist_ok=True);json.dump(o,open('pub/em2.json','w'))
          PY
          cd pub && git init -q && git checkout -q -b tmp-em2 && git add . && git -c user.name=bot -c user.email=bot@x commit -qm em && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-em2 && echo XXPUSHED
