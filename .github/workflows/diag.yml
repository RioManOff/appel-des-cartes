name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - run: pip install -q pillow
      - run: |
          curl -sL https://raw.githubusercontent.com/RioManOff/appel-des-cartes/diag-prix/msx-data.b64 -o data.b64; wc -c data.b64
          python3 - <<'PY'
          import json,gzip,base64,urllib.request,io,os,time,concurrent.futures as cf
          from PIL import Image
          O=json.loads(gzip.decompress(base64.b64decode(''.join(l.strip() for l in open('data.b64')))))
          def img(a):
            cid,pid=a
            for t in range(3):
              try:
                b=urllib.request.urlopen(urllib.request.Request('https://tcgplayer-cdn.tcgplayer.com/product/%d_in_1000x1000.jpg'%pid,headers={'User-Agent':'Mozilla/5.0'}),timeout=40).read()
                im=Image.open(io.BytesIO(b)).convert('RGB')
                if im.width>im.height:im=im.rotate(90,expand=True)
                im=im.resize((400,560),Image.LANCZOS);x=io.BytesIO();im.save(x,'WEBP',quality=80,method=4)
                return cid,'data:image/webp;base64,'+base64.b64encode(x.getvalue()).decode()
              except urllib.error.HTTPError as e:
                if e.code==404:return cid,None
                time.sleep(2)
              except Exception:time.sleep(2)
            return cid,None
          os.makedirs('pub',exist_ok=True);ok=0;miss=[]
          with cf.ThreadPoolExecutor(16) as ex:
            for sid,L in O:
              R=dict(ex.map(img,L))
              ks=[c for c,_ in L]
              for n in range(0,len(ks),100):
                part={k:R[k] for k in ks[n:n+100] if R.get(k)}
                fn='pub/msx-%s%s.json'%(sid,'' if n==0 else '-%d'%(n//100+1))
                json.dump(part,open(fn,'w'))
              ok+=sum(1 for v in R.values() if v);miss+=[k for k,v in R.items() if not v]
              print('XXSET',sid,len(L),sum(1 for v in R.values() if v),flush=True)
          json.dump(miss,open('pub/manquantes.json','w'))
          print('XXTOTAL',ok,'manquantes',len(miss))
          PY
          cd pub && git init -q && git checkout -q -b ms-photos && git add . && git -c user.name=bot -c user.email=bot@x commit -qm "photos Masters (promos, TB, EX…)" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ms-photos && echo XXPUSHED
