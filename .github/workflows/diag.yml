    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pillow
          python3 - <<'PY'
          import json,os,io,re,time,urllib.request
          from PIL import Image
          NM=json.loads('''["E-148 ★", "E-148", "E-149 ★", "E-149", "E-150 ★", "E-150", "E-151 ★", "E-151", "E-152 ★", "E-152", "E-153 ★", "E-153", "E-154 ★", "E-154", "E-155 ★", "E-155", "E-156 ★", "E-156", "E-157 ★", "E-157", "E-158 ★", "E-158", "E-159 ★", "E-159", "FB05-025", "FB05-025 (2)", "FB08-073", "FB08-073 (2)", "ST01-001", "ST01-001 (2)", "ST01-002", "ST01-002 (2)", "ST01-003", "ST01-003 (2)", "ST01-004", "ST01-004 (2)", "ST01-005", "ST01-005 (2)", "ST01-006", "ST01-006 (2)", "ST01-007", "ST01-007 (2)", "ST01-008", "ST01-008 (2)", "ST01-009", "ST01-009 (2)", "ST01-010", "ST01-010 (2)", "ST01-011", "ST01-011 (2)", "ST01-012", "ST01-012 (2)", "ST01-013", "ST01-013 (2)", "ST01-014", "ST01-014 (2)", "ST01-015", "ST01-015 (2)", "ST01-016", "ST01-016 (2)", "ST01-017", "ST01-017 (2)", "ST01-018", "ST01-018 (2)", "ST01-019", "ST01-019 (2)", "ST01-020", "ST01-020 (2)", "ST01-021", "ST01-021 (2)", "ST01-022", "ST01-022 (2)", "ST01-023", "ST01-023 (2)", "ST01-024", "ST01-024 (2)", "ST01-025", "ST01-025 (2)", "ST01-026", "ST01-026 (2)", "ST01-027", "ST01-027 (2)", "ST01-028", "ST01-028 (2)", "ST01-029", "ST01-029 (2)", "ST01-030", "ST01-030 (2)", "ST01-031", "ST01-031 (2)", "ST01-032", "ST01-032 (2)", "ST01-033", "ST01-033 (2)", "ST01-034", "ST01-034 (2)", "ST01-035", "ST01-035 (2)", "ST01-036", "ST01-036 (2)", "ST01-037", "ST01-037 (2)", "ST01-038", "ST01-038 (2)", "ST01-039", "ST01-039 (2)", "ST01-040", "ST01-040 (2)", "ST01-041", "ST01-041 (2)", "ST01-042", "ST01-042 (2)", "ST01-043", "ST01-043 (2)", "ST01-044", "ST01-044 (2)", "ST01-045", "ST01-045 (2)", "ST01-046", "ST01-046 (2)", "ST01-047", "ST01-047 (2)", "ST01-048", "ST01-048 (2)", "ST01-049", "ST01-049 (2)", "ST01-050", "ST01-050 (2)", "ST01-051", "ST01-051 (2)", "ST01-052", "ST01-052 (2)", "ST01-053", "ST01-053 (2)", "ST01-054", "ST01-054 (2)", "ST01-055", "ST01-055 (2)", "ST01-056", "ST01-056 (2)", "ST01-057", "ST01-057 (2)", "ST01-058", "ST01-058 (2)", "ST01-059", "ST01-059 (2)", "ST01-060", "ST01-060 (2