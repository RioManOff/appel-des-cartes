name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          python3 - <<'PY'
          import re,time,http.cookiejar,urllib.request
          cj=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj));op.addheaders=[('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36')]
          B='http://www.dbzcollection.fr/2v2/'
          def get(u):
            for k in range(3):
              try:return op.open(B+u,timeout=60).read().decode('latin-1')
              except Exception as e:time.sleep(3)
            return ''
          get('cartes.php?idc=99')
          CARD=r'<a name="c(\d+)"></a>\s*<div class="bc_cadre"[^>]*>\s*<div class="bc_cadre_numero" title="([^"]*)"[^>]*><div class="bc_texte_numero">([^<]*)</div>.*?afficher_detail\(\'\d+\',\'([^\']+)\'\)'
          for idc in [330,331,336]:
            t=get('cartes.php?idc=%d'%idc)
            sets=[]
            for m in re.finditer(r'href="cartes\.php\?idc=%d&(?:amp;)?ids=(\d+)"><img id="([^"]+)"'%idc,t):
              if m.group(1) not in [x[0] for x in sets]:sets.append((m.group(1),m.group(2)))
            print('XX COL',idc,len(sets))
            for ids,nm in sets:
              out=[];p=1
              while True:
                tt=get('cartes.php?idc=%d&ids=%s'%(idc,ids)+('&p=%d'%p if p>1 else ''))
                out+=[(m.group(3).strip(),m.group(2),m.group(4)) for m in re.finditer(CARD,tt,re.S)]
                if ('ids=%s&p=%d"'%(ids,p+1)) in tt or ('ids=%s&amp;p=%d"'%(ids,p+1)) in tt:p+=1
                else:break
              em=[o for o in out if not re.match(r'^[A-Z]{1,3}\d',o[0])]
              print('XX',idc,ids,nm,len(out),'non-num:',[(o[0],o[1],o[2]) for o in em][:12])
          PY
