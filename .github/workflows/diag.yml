name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pillow
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,io,os
          from PIL import Image
          def post(u,d):
            r=urllib.request.Request(u,data=json.dumps(d).encode(),headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'})
            return json.loads(urllib.request.urlopen(r,timeout=30).read())
          os.makedirs('packs3',exist_ok=True)
          for sid,q in [('BT21','Wild Resurgence'),('DB1','Dragon Brawl')]:
            d=post('https://mp-search-api.tcgplayer.com/v1/search/request?q='+urllib.parse.quote(q)+'&isList=false',{"algorithm":"","from":0,"size":15,"filters":{"term":{"productLineName":["dragon-ball-super-ccg"]},"range":{},"match":{}},"listingSearch":{"filters":{"term":{},"range":{},"exclude":{"channelExclusion":0}},"context":{"cart":{}}},"context":{"cart":{},"shippingCountry":"US"},"settings":{"useFuzzySearch":True,"didYouMean":{}},"sort":{}})
            for r in d['results'][0]['results']:
              n=r['productName']
              if not any(w in n.lower() for w in ('pack','booster')) or 'box' in n.lower() or 'case' in n.lower():continue
              pid=int(r['productId'])
              try:
                b=urllib.request.urlopen(urllib.request.Request('https://tcgplayer-cdn.tcgplayer.com/product/%d_in_1000x1000.jpg'%pid,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
                im=Image.open(io.BytesIO(b)).convert('RGB');im.thumbnail((360,600));im.save('packs3/%s_%d.webp'%(sid,pid),'WEBP',quality=82);print('OK',sid,pid,n)
              except Exception as e:print('IMG',sid,pid,n,e)
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs3 && git commit -q -m packs3 && git push -q
