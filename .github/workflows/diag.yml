name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Voix
        run: |
          pip install -q edge-tts
          mkdir -p voix
          edge-tts --voice fr-FR-HenriNeural --rate=+12% --text "Mon bote repère les cartes Pokémon sur Vintaide." --write-media voix/fr-FR-HenriNeural-1b.mp3
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voix && git commit -q -m "voix 1b" && git push -q origin HEAD:diag-prix
