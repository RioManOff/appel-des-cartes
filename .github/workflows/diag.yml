name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q edge-tts
          mkdir -p voix2
          V=fr-FR-HenriNeural
          edge-tts -v $V --rate=+8% -t "Tu collectionnes les cartes Dragon Ball ?" --write-media voix2/a1.mp3
          edge-tts -v $V --rate=+8% -t "L'Appel des Cartes, c'est l'appli pour gérer toute ta collection : Fusion World, Masters, et même les anciennes séries." --write-media voix2/a2.mp3
          edge-tts -v $V --rate=+8% -t "Les prix, le scanner, les boosters, tes stats : tout est dedans." --write-media voix2/a3.mp3
          edge-tts -v $V --rate=+8% -t "Elle arrive sur le Play Store, et j'ai besoin de testeurs !" --write-media voix2/a4.mp3
          edge-tts -v $V --rate=+8% -t "Envoie-moi ton adresse Gmail en message privé, et teste l'appli en avant-première !" --write-media voix2/a5.mp3
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voix2 && git commit -q -m voix2 && git push -q
