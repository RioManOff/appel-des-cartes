name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request
          def st(u):
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30);return r.status,len(r.read())
            except Exception as e:return str(e)[:30],0
          for reg in ['europe-fr','fr','eu-fr','europe']:
            for c in ['BT1-004','BT10-001','BT20-001','BT25-001','BT31-001']:
              u='https://www.dbs-cardgame.com/%s/images/cardlist/cardimg/%s.png'%(reg,c);print(st(u),u)
          for c in ['BT1-011_SPR','BT1-011_PR','BT16-147_GDR','BT16-147_PR','BT16-147_SPR','BT25-001_PR','BT31-001']:
            u='https://www.dbs-cardgame.com/images/cardlist/cardimg/%s.png'%c;print(st(u),u)
          PY
