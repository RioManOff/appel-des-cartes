name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appel-des-cartes-playstore
          run-id: 45544673022
          github-token: ${{ github.token }}
          path: pub
      - run: |
          ls -la pub; cd pub && f=$(ls *.aab | head -1) && mv "$f" appel-des-cartes-1.7.aab && ls -la
          git init -q && git checkout -q -b tmp-aab && git add . && git -c user.name=bot -c user.email=bot@x commit -qm aab && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-aab && echo XXPUSHED
