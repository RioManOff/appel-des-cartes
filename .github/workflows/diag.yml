name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re,json
          def get(u,b=False):
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read();return r if b else r.decode('utf-8','ignore')
            except Exception as e:return None
          for u in ['https://product-images.s3.cardmarket.com/1050/2082/316784/316784.jpg','https://product-images.s3.cardmarket.com/1050/2082/316784/316784.png','https://product-images.s3.cardmarket.com/13/2082/316784/316784.jpg']:
            b=get(u,True);print('CM',u,len(b) if b else None)
          S=json.loads(get('https://downloads.s3.cardmarket.com/productCatalog/productList/products_nonsingles_13.json'))['products']
          for p in S:
            if re.search(r'Booster$',p['name']) and p.get('idCategory')==1050:print('P',p['idProduct'],p['idExpansion'],p['name'])
          for n in ['10','25']:
            for reg in ['jp','japan']:
              t=get('https://www.dbs-cardgame.com/%s/product/dbs-b%s.php'%(reg,n)) or ''
              print('JP',reg,n,len(t),sorted(set(re.findall(r'[\w./-]*images/product/[\w./-]+',t)))[:10])
          PY
