name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import re,time,http.cookiejar,urllib.request
          cj=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj));op.addheaders=[('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36')]
          B='http://www.dbzcollection.fr/2v2/'
          def get(u):
            for k in range(3):
              try:return op.open(B+u,timeout=60).read().decode('latin-1')
              except Exception:time.sleep(3)
            return ''
          get('cartes.php?idc=99')
          t=get('collections.php')
          print('XXLEN',len(t))
          for m in re.finditer(r'idc=(\d+)[^>]*>([^<]{0,80})',t):
            if re.search(r'super|master|zenkai|bt|ultra|card game|fusion',m.group(2),re.I):print('XXC',m.group(1),m.group(2).strip())
          for idc in (330,):
            tt=get('cartes.php?idc=%d'%idc)
            for m in re.finditer(r'ids=(\d+)"><img id="([^"]+)"',tt):print('XXS',idc,m.group(1),m.group(2))
          PY
