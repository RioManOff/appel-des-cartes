name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            LISEZMOI.txt
      - run: |
          python3 - <<'PY'
          import re,json,time,base64,os,http.cookiejar,urllib.request
          from concurrent.futures import ThreadPoolExecutor
          cj=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj));op.addheaders=[('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36')]
          B='http://www.dbzcollection.fr/2v2/'
          def raw(u):
            for k in range(4):
              try:return op.open(B+u,timeout=60).read()
              except Exception as e:time.sleep(2+k*3)
            return b''
          get=lambda u:raw(u).decode('latin-1')
          get('cartes.php?idc=99')
          CARD=r'<a name="c(\d+)"></a>\s*<div class="bc_cadre"[^>]*>\s*<div class="bc_cadre_numero" title="([^"]*)"[^>]*><div class="bc_texte_numero">([^<]*)</div>.*?afficher_detail\(\'\d+\',\'([^\']+)\'\)'
          def cards(idc,ids):
            out=[];p=1
            while True:
              t=get('cartes.php?idc=%d&ids=%d'%(idc,ids)+('&p=%d'%p if p>1 else ''))
              out+= [(m.group(1),m.group(3).strip(),m.group(2),m.group(4)) for m in re.finditer(CARD,t,re.S)]
              if ('ids=%d&p=%d"'%(ids,p+1)) in t or ('ids=%d&amp;p=%d"'%(ids,p+1)) in t: p+=1
              else: break
            return out
          os.makedirs('sdbh',exist_ok=True)
          M=[]
          JOBS=[(c,None) for c in [199,205,207,208,256,289,329]]+[(335,[1419]),(171,[695])]
          for idc,only in JOBS:
            t=get('cartes.php?idc=%d'%idc)
            sets=[]
            for m in re.finditer(r'href="cartes\.php\?idc=%d&(?:amp;)?ids=(\d+)"><img id="([^"]+)"'%idc,t):
              if int(m.group(1)) not in [x[0] for x in sets]:sets.append((int(m.group(1)),m.group(2)))
            if only:sets=[x for x in sets if x[0] in only]
            for ids,nm in sets:
              C=cards(idc,ids)
              def dl(c):
                b=raw('cartes/%s_carte.jpg'%c[3])
                return 'data:image/jpeg;base64,'+base64.b64encode(b).decode() if b[:2]==b'\xff\xd8' else ''
              with ThreadPoolExecutor(8) as ex: imgs=list(ex.map(dl,C))
              sid='D%d'%ids;d={}
              for k,(c,u) in enumerate(zip(C,imgs)):
                if u:d[sid+'-'+str(k+1).zfill(4 if len(C)>999 else 3)]=u
              json.dump(d,open('sdbh/%s.json'%sid,'w'),separators=(',',':'))
              M.append([ids,idc,nm,len(C),[c[1] for c in C],[c[2] for c in C]])
              print('SET',idc,ids,nm,len(C),'imgs',len(d),flush=True)
          json.dump(M,open('sdbh/manifest.json','w'),ensure_ascii=False)
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan sdbh-photos; git reset -q || true; git add --sparse -f sdbh && git commit -q -m "photos SDBH" && git push -q -f origin sdbh-photos
