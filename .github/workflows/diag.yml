name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,html,os
          B='https://downloads.s3.cardmarket.com/productCatalog/'
          def L(u):return json.loads(urllib.request.urlopen(urllib.request.Request(B+u,headers={'User-Agent':'x'}),timeout=120).read())
          try:P=L('productList/products_nonsingles_13.json')
          except Exception as e:print('XXE',e);P={}
          print('XXKEYS',list(P)[:5])
          prods=P.get('products',[])
          G={g['idProduct']:g for g in L('priceGuide/price_guide_13.json')['priceGuides']}
          out=[[p['idProduct'],html.unescape(p.get('name','')),p.get('idExpansion'),p.get('categoryName'),G.get(p['idProduct'],{}).get('trend'),G.get(p['idProduct'],{}).get('avg30')] for p in prods]
          print('XXN',len(out),out[:3])
          os.makedirs('pub',exist_ok=True);json.dump(out,open('pub/ns.json','w'))
          PY
          cd pub && git init -q && git checkout -q -b tmp-ns && git add . && git -c user.name=bot -c user.email=bot@x commit -qm ns && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-ns && echo XXPUSHED
