name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request
          body=json.dumps({"algorithm":"sales_synonym_v2","from":0,"size":50,"filters":{"term":{},"range":{},"match":{}},"listingSearch":{"context":{"cart":{}},"filters":{"term":{"sellerStatus":"Live","channelId":0},"range":{"quantity":{"gte":1}},"exclude":{"channelExclusion":0}}},"context":{"cart":{},"shippingCountry":"US"},"settings":{"useFuzzySearch":False,"didYouMean":{}},"sort":{}}).encode()
          for q in ['Energy Marker BT31','BT31-EM','Energy Marker Impact Beyond Dimensions','Energy Marker BT30','Energy Marker BT29','Energy Marker BT28']:
            try:
              r=urllib.request.urlopen(urllib.request.Request('https://mp-search-api.tcgplayer.com/v1/search/request?q='+urllib.parse.quote(q)+'&isList=false',data=body,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Origin':'https://www.tcgplayer.com'}),timeout=30)
              d=json.load(r)
              res=d['results'][0]['results']
              print('XXQ',q,len(res))
              for x in res:
                cn=(x.get('customAttributes') or {}).get('number')
                print('XXR',int(x['productId']),x['productName'],'|',x.get('setName'),'|',cn,'|',x.get('rarityName'))
            except Exception as e:print('XXE',q,e)
          PY
