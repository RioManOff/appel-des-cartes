name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,html,re,os,collections
          B='https://downloads.s3.cardmarket.com/productCatalog/'
          P=json.loads(urllib.request.urlopen(urllib.request.Request(B+'productList/products_singles_13.json',headers={'User-Agent':'x'}),timeout=120).read())['products']
          E=json.loads(urllib.request.urlopen(urllib.request.Request(B+'productList/products_nonsingles_13.json',headers={'User-Agent':'x'}),timeout=120).read()) if False else None
          out=[[p['idProduct'],html.unescape(p.get('name','')),p.get('idExpansion')] for p in P]
          os.makedirs('pub',exist_ok=True);json.dump(out,open('pub/cm.json','w'))
          print('XXN',len(out))
          PY
          cd pub && git init -q && git checkout -q -b tmp-cm && git add . && git -c user.name=bot -c user.email=bot@x commit -qm cm && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-cm && echo XXPUSHED
