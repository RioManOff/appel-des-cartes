name: diag-prix
'on': push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - run: echo '' | base64 -d > docs/seal_pid.json
    - run: "python3 - <<'PYEOF'\nimport json, re, sys, time, urllib.request\nBASE = 'https://downloads.s3.cardmarket.com/productCatalog/'\ndef lire(url):\n    for essai in range(1, 5):\n        try:\n            with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'appel-des-cartes'}), timeout=120) as r:\n                return json.loads(r.read().decode('utf-8'))\n        except Exception as e:\n            print('Essai %d/4 : %s -> %s' % (essai, url, e)); time.sleep(5 * essai)\n    print('Scellés : téléchargement impossible, je ne change rien.'); sys.exit(0)\ntry:\n    lien = json.load(open('docs/seal_pid.json', encoding='utf-8'))\n    prix = json.load(open('docs/prix.json', encoding='utf-8'))\nexcept Exception as e:\n    print('fichiers absents ou illisibles (%s) : je ne change rien.' % e); sys.exit(0)\nG = {g['idProduct']: g for g in lire(BASE + 'priceGuide/price_guide_13.json').get('priceGuides', []) if isinstance(g, dict) and 'idProduct' in g}\nancien = prix.get('s') if isinstance(prix.get('s'), dict) else dict(lien.get('seed', {}))\ns, sx = {}, []\nfor k, ip in lien.get('fw', {}).items():\n    g = G.get(ip) or {}\n    t0, a30 = g.get('trend'), g.get('avg30')\n    v, est = None, False\n    if isinstance(t0, (int, float)) and t0 > 0 and not (isinstance(a30, (int, float)) and a30 >= 1 and a30 >= 10 * t0):\n        v = t0\n    else:\n        for c in ('avg30', 'avg7', 'avg1', 'avg', 'low'):\n            x = g.get(c)\n            if isinstance(x, (int, float)) and x > 0:\n                v, est = x, c != 'avg30'\n                break\n    if v:\n        s[k] = round(v, 2)\n        if est:\n            sx.append(k)\nfor k, v in ancien.items():          # pas de prix aujourd'hui : on garde le dernier connu (marqué estimation)\n    if k not in s and isinstance(v, (int, float)) and v > 0:\n        s[k] = v; sx.append(k)\nif len(s) < 5:\n    print('trop peu de prix de scellés (%d) : je ne change rien.' % len(s)); sys.exit(0)\nprix['s'] = {k: s[k] for k in sorted(s)}; prix['sx'] = sorted(set(sx))\nwith open('docs/prix.json', 'w', encoding='utf-8') as f:\n    f.write(json.dumps(prix, ensure_ascii=False, separators=(',', ':')) + '\\n')\n# historique : un prix par jour et par produit scellé (Fusion World et Masters), 365 jours au plus\ntry:\n    ms = json.load(open('docs/prix_ms.json', encoding='utf-8')).get('t', {})\nexcept Exception:\n    ms = {}\njour = {k: v for k, v in prix['s'].items()}\njour.update({k: v for k, v in ms.items() if re.search(r'-(booster|display|case)$', k)})\ntry:\n    h = json.load(open('docs/hist_seal.json', encoding='utf-8'))\n    assert isinstance(h.get('d'), list) and isinstance(h.get('v'), dict)\nexcept Exception:\n    h = {'d': [], 'v': {}}\ndate = prix.get('date')\nif date and (not h['d'] or h['d'][-1] != date):\n    n = len(h['d'])\n    h['d'].append(date)\n    for k in set(h['v']) | set(jour):\n        L = h['v'].setdefault(k, [None] * n)\n        L.extend([None] * (n - len(L)))\n        L.append(round(jour[k] * 100) if k in jour else None)\n    if len(h['d']) > 365:\n        cut = len(h['d']) - 365\n        h['d'] = h['d'][cut:]\n        h['v'] = {k: L[cut:] for k, L in h['v'].items()}\n    with open('docs/hist_seal.json', 'w', encoding='utf-8') as f:\n        f.write(json.dumps(h, separators=(',', ':')) + '\\n')\nprint('OK scellés : %d prix Fusion World (%d estimés), %d produits dans l’historique' % (len(s), len(set(sx)), len(jour)))\nPYEOF\n\npython3 -c \"import json;p=json.load(open('docs/prix.json'));print('XXS',json.dumps(p['s']),p['sx']);h=json.load(open('docs/hist_seal.json'));print('XXH',h['d'],len(h['v']),list(h['v'].items())[:3])\""
