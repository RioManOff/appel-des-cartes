name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          t(){ c=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' -A 'Mozilla/5.0' "$1"); echo "XX $c $1"; }
          B=https://www.dbs-cardgame.com/images/cardlist/cardimg
          for s in BT27 BT28 BT29 BT30 BT31; do for n in 01 02 06 07 08; do t "$B/$s-EM$n.png"; done; t "$B/$s-EM01_p1.png"; t "$B/$s-EM01_PR.png"; t "$B/$s-EM01-GS.png"; done
          curl -s -A 'Mozilla/5.0' "https://www.dbs-cardgame.com/us-en/cardlist/?search=true&category=428031" -o l.html; echo "XXSIZE $(wc -c < l.html)"; grep -o 'BT31-EM[^"<]\{0,30\}' l.html | sort -u | head -30 | sed 's/^/XXL /'
          grep -o 'cardimg/[^"]*EM[^"]*' l.html | sort -u | head | sed 's/^/XXI /'
          grep -o 'category=4280[0-9]*' l.html | sort -u | head -40 | tr '\n' ' ' | sed 's/^/XXC /'
