name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,html,re
          def get(u,t=30):
            try:return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=t).read()
            except Exception as e:return None
          ok=[n for n in range(1,160) if get('https://www.dbs-cardgame.com/images/cardlist/cardimg/BT32-%03d.png'%n,15)]
          print('XXIMG',len(ok),ok[:5],ok[-5:])
          for u in ['https://www.dbs-cardgame.com/fw/en/cardlist/','https://www.dbs-cardgame.com/us-en/cardlist/?search=true&category%5B%5D=428032','https://www.dbs-cardgame.com/us-en/cardlist/']:
            b=get(u);print('XXPAGE',u,len(b) if b else None, re.findall(r'BT32[^<"]{0,40}',b.decode('utf-8','ignore'))[:5] if b else '')
          B='https://downloads.s3.cardmarket.com/productCatalog/'
          P=json.loads(get(B+'productList/products_singles_13.json',120))['products']
          ex={}
          for p in P:ex.setdefault(p.get('idExpansion'),[]).append(html.unescape(p.get('name','')))
          mx=max(ex);print('XXEXP',sorted(ex)[-6:])
          for e in sorted(ex)[-6:]:print('XXE',e,len(ex[e]),ex[e][:4])
          for p in P:
            n=html.unescape(p.get('name',''))
            if 'Inoshikacho' in n or 'Fasha, Enduring' in n:print('XXHIT',p['idProduct'],p.get('idExpansion'),n)
          PY
