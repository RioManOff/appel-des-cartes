name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re
          def get(u):
            try:return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','ignore')
            except Exception as e:return 'ERR '+str(e)
          for n in ['02','10','25']:
            t=get('https://www.dbs-cardgame.com/us-en/product/dbs-b%s.php'%n)
            print('==',n,sorted(set(re.findall(r'[\w./-]*images/product/[\w./-]+',t)))[:20])
            print('og',re.findall(r'og:image"\s+content="([^"]+)',t))
          for u in ['https://www.dbs-cardgame.com/images/product/dbs-b02/img_01.png','https://www.dbs-cardgame.com/images/product/dbs-b02/img_pack.png','https://www.dbs-cardgame.com/images/product/dbs-b02/img_main.png','https://www.dbs-cardgame.com/images/product/dbs-b25/img_01.png']:
            try:r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30);print('OK',len(r.read()),u)
            except Exception as e:print('NO',u,e)
          PY
