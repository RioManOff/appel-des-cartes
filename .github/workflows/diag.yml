          FBM={25:'FB05-025_f_p3',26:'FB05-025_f_p4',27:'FB08-073_f_p2',28:'FB08-073_f_p3'}
          def get(u):
            for k in range(3):
              try:return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
              except urllib.error.HTTPError as e:
                if e.code==404:return None
              except Exception:pass
              time.sleep(2)
          def save(b,p):
            im=Image.open(io.BytesIO(b)).convert('RGB')
            if im.width>im.height:im=im.rotate(90,expand=True)
            im=im.resize((400,round(im.height*400/im.width)),Image.LANCZOS);im.save(p,'WEBP',quality=80,method=6)
          for L,pre,d,only in (('jp','D','st01/jp',None),('en','E','st01/en',set(FBM))):
            B='https://www.dbs-cardgame.com/fw/images/cards/card/%s/'%L
            os.makedirs(d,exist_ok=True);os.makedirs(d+'_b',exist_ok=True);ok=[];miss=[]
            for i,nm in enumerate(NM):
              if only and i+1 not in only:continue
              cid=pre+'1547-'+str(i+1).zfill(3)
              if i+1 in FBM:
                b=get(B+FBM[i+1]+'.webp')
                if b:save(b,'%s/%s.webp'%(d,cid));ok.append(cid)
                else:miss.append((cid,nm))
                continue
              m=re.match(r'^((?:SB|FB|FS|ST)\d\d-\d{2,3}|E-\d{2,3})( ★)?(?: \((\d+)\))?$',nm.strip())
              if not m:miss.append((cid,nm));continue
              code,star,k=m.group(1),m.group(2),int(m.group(3) or 1)
              v=1 if star else k-1
              c=[code+'_f.webp',code+'.webp'] if v==0 else [code+'_f_p%d.webp'%v,code+'_p%d.webp'%v]
              b=None
              for f in c:
                b=get(B+f)
                if b:break
              if not b:miss.append((cid,nm));continue
              save(b,'%s/%s.webp'%(d,cid));ok.append(cid)
              bb=get(B+code+('_b.webp' if v==0 else '_b_p%d.webp'%v))
              if bb:save(bb,'%s_b/%s.webp'%(d,cid));print('verso',L,cid,nm)
            print(L,'ok',len(ok),'manquantes',len(miss),miss)
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add st01 && git commit -q -m "photos ST01 jp" && git push -q
