name: diag-prix
on: push
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: docs/back
      - name: Versos des leaders promo anglais
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import json,io,urllib.request
          from PIL import Image
          B=json.loads('''{"E9001-152": "FS06-01_b_p1.webp", "E9001-153": "FS07-01_b_p1.webp", "E9001-169": "FS01-01_b_p1.webp", "E9001-170": "FS02-01_b_p1.webp", "E9001-171": "FS03-01_b_p1.webp", "E9001-172": "FS04-01_b_p1.webp", "E9001-173": "FS05-01_b_p1.webp", "E9001-174": "FP-030_b.webp"}''');ok=[]
          for cid,f in B.items():
            try:
              b=urllib.request.urlopen(urllib.request.Request('https://www.dbs-cardgame.com/fw/images/cards/card/en/'+f,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
            except Exception as e:print('manque',f,e);continue
            im=Image.open(io.BytesIO(b)).convert('RGB');im=im.resize((400,round(im.height*400/im.width)),Image.LANCZOS);im.save('docs/back/%s.webp'%cid,'WEBP',quality=80,method=6);ok.append(cid)
          print('versos',ok)
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/back && git commit -q -m "Versos des leaders promo anglais" && git push -q origin HEAD:main
