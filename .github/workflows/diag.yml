name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re
          def get(u):
            try:return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','ignore')
            except Exception as e:return 'ERR '+str(e)
          for u in ['https://www.dbs-cardgame.com/us-en/products/','https://www.dbs-cardgame.com/us-en/products/?category=booster','https://www.dbs-cardgame.com/us-en/products/boosterpack.php','https://www.dbs-cardgame.com/us-en/products/index.php']:
            t=get(u);print('==',u,len(t),t[:80] if t.startswith('ERR') else '')
            imgs=sorted(set(re.findall(r'(?:src|href)="([^"]+\.(?:png|jpg|webp)|[^"]*products/[^"]+)"',t)))
            print(len(imgs));print('\n'.join(imgs[:120]))
          PY
