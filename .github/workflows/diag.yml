name: diag-prix
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,json
          def post(u,d):
            r=urllib.request.Request(u,data=json.dumps(d).encode(),headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'})
            return json.loads(urllib.request.urlopen(r,timeout=30).read())
          try:
            for q in ['Galactic Battle Booster Pack','Colossal Warfare Booster Pack','Rise of the Unison Warrior Booster Pack','Legend of the Dragon Balls Booster Pack']:
              d=post('https://mp-search-api.tcgplayer.com/v1/search/request?q='+urllib.parse.quote(q)+'&isList=false',{"algorithm":"","from":0,"size":5,"filters":{"term":{"productLineName":["dragon-ball-super-ccg"]},"range":{},"match":{}},"listingSearch":{"filters":{"term":{},"range":{},"exclude":{"channelExclusion":0}},"context":{"cart":{}}},"context":{"cart":{},"shippingCountry":"US"},"settings":{"useFuzzySearch":True,"didYouMean":{}},"sort":{}})
              for r in d['results'][0]['results'][:5]:print('T',q,'|',int(r['productId']),r['productName'],r.get('setName'))
          except Exception as e:print('ERR',e)
          for u in ['https://tcgplayer-cdn.tcgplayer.com/product/0_in_1000x1000.jpg']:
            pass
          PY
