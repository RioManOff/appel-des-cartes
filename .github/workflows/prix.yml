name: Prix Cardmarket

# Chaque nuit, télécharge les prix publiés par Cardmarket, met à jour docs/prix.json et ajoute le prix du jour
# à l'historique (docs/hist/FB01.json, FB02.json…) qui sert aux courbes de prix.
# L'appli lit ces fichiers (les prix intégrés à l'appli servent de secours).
# Pour le lancer tout de suite : onglet Actions > Prix Cardmarket > Run workflow.

on:
  schedule:
    - cron: '30 4 * * *'   # tous les jours à 04:30 UTC ; Cardmarket publie ses prix vers 02:50 (heure de Paris)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prix-cardmarket
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les prix, écrire docs/prix.json et l'historique
        env:
          PYTHONUTF8: '1'
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Prix Cardmarket pour L'Appel des Cartes.

          Télécharge les fichiers que Cardmarket publie chaque nuit (Dragon Ball Super Card Game = jeu 13),
          associe chaque produit à une carte de l'appli, écrit docs/prix.json et garde l'historique des prix :

            {"v":1,"date":"AAAA-MM-JJ","n":1553,"t":{"FB01-001":0.36,...},"a":{"FB01-001":[0.25,0.39,0.02],...}}

            t = prix « Tendance des prix » (à défaut : moyenne ou prix le plus bas connu)
            a = prix moyens sur 30 jours, 7 jours et 1 jour (seulement quand la tendance existe)

          Historique : chaque nuit, la « Tendance des prix » du jour est ajoutée dans docs/hist/FB01.json, FB02.json…
          (un fichier par série, 120 jours au plus, prix en centimes, 0 = pas de prix ce jour-là) :

            {"v":1,"e":"FB01","d":["2026-10-10","2026-10-11"],"t":{"FB01-001":[36,35],...}}

          Une même carte peut avoir plusieurs versions sur Cardmarket : le 1er produit est la carte normale,
          le 2e l'Alternative Art (_ALT), le 3e la seconde Alternative Art (_ALT2).
          Pour FB01 à FB05 l'édition la plus récente (japonaise) passe avant l'édition anglaise.
          """
          import collections
          import html
          import json
          import os
          import re
          import sys
          import time
          import urllib.request

          JEU = 13
          BASE = 'https://downloads.s3.cardmarket.com/productCatalog/'
          URL_PRIX = BASE + 'priceGuide/price_guide_%d.json' % JEU
          URL_PRODUITS = BASE + 'productList/products_singles_%d.json' % JEU
          SORTIE = os.environ.get('PRIX_OUT', 'docs/prix.json')
          LOCAL = os.environ.get('PRIX_LOCAL', '')          # dossier avec les 2 fichiers (essais hors ligne)
          SUFFIXES = ['', '_ALT', '_ALT2']
          JOURS_MAX = 120                                   # durée de l'historique gardé pour chaque série
          # Extensions Cardmarket de chaque série, par ordre de préférence (édition japonaise d'abord pour FB01 à FB05).
          # Une série qui n'est pas dans cette liste (FB12 et suivantes) est détectée toute seule : ce sont les extensions
          # qui contiennent presque autant de cartes que la plus grande, la plus récente passant en premier.
          EXTENSIONS = {
              'FB01': [5731, 5552], 'FB02': [5767, 5730], 'FB03': [5903, 5847], 'FB04': [5906, 5905], 'FB05': [6076, 6027],
              'FB06': [6132], 'FB07': [6183], 'FB08': [6410], 'FB09': [6502], 'FB10': [6594], 'FB11': [6785],
          }
          ORDRE = ('trend', 'trend-foil', 'avg30', 'avg30-foil', 'avg7', 'avg7-foil', 'avg', 'avg-foil', 'low', 'low-foil')


          def echec(msg):
              print('ERREUR : ' + msg, file=sys.stderr)
              sys.exit(1)


          def lire(nom, url):
              if LOCAL:
                  chemin = os.path.join(LOCAL, nom)
                  try:
                      with open(chemin, encoding='utf-8') as f:
                          return json.load(f)
                  except Exception as e:
                      echec('fichier local illisible : %s (%s)' % (chemin, e))
              derniere = None
              for essai in range(1, 5):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'appel-des-cartes-prix/1.0'})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      derniere = e
                      print('Essai %d/4 : %s -> %s' % (essai, url, e))
                      time.sleep(5 * essai)
              echec('téléchargement impossible : %s (%s). Cardmarket a peut-être déplacé ses fichiers : '
                    'https://www.cardmarket.com/Data/Download' % (url, derniere))


          def meilleur(g):
              """Premier prix > 0 dans l'ordre de confiance : tendance, moyennes, puis prix le plus bas."""
              if g:
                  for k in ORDRE:
                      v = g.get(k)
                      if isinstance(v, (int, float)) and not isinstance(v, bool) and v > 0:
                          return v, k
              return None, None


          def lire_hist(chemin, serie):
              """Historique déjà enregistré pour une série : (dates, {carte: [centimes]}), ou None s'il manque ou s'il est abîmé."""
              try:
                  with open(chemin, encoding='utf-8') as f:
                      h = json.load(f)
                  d, t = h['d'], h['t']
                  bon = (h.get('v') == 1 and h.get('e') == serie and isinstance(d, list) and isinstance(t, dict)
                         and all(isinstance(x, str) and re.fullmatch(r'\d{4}-\d{2}-\d{2}', x) for x in d)
                         and all(d[i] < d[i + 1] for i in range(len(d) - 1))
                         and all(isinstance(c, list) and len(c) == len(d)
                                 and all(isinstance(x, int) and not isinstance(x, bool) and x >= 0 for x in c) for c in t.values()))
                  return (d, t) if bon else None
              except Exception:
                  return None


          def maj_historique(dossier, date, tendance, avant):
              """Ajoute le prix du jour à docs/hist/<série>.json (un fichier par série).

              tendance : {carte: prix « Tendance des prix »}, seulement pour les cartes qui ont une vraie tendance
              avant    : ancien prix.json (sert à démarrer l'historique d'une série avec le relevé de la veille)
              Relancé le même jour, le script remplace la dernière valeur : le résultat ne change pas."""
              dossier_h = os.path.join(dossier or '.', 'hist')
              os.makedirs(dossier_h, exist_ok=True)
              par = collections.defaultdict(dict)
              for cid, v in tendance.items():
                  par[cid.split('-')[0]][cid] = int(round(v * 100))
              ecrits = 0
              for serie in sorted(par):
                  chemin = os.path.join(dossier_h, serie + '.json')
                  h = lire_hist(chemin, serie)
                  if h is None:
                      if os.path.exists(chemin):
                          print('Historique de %s illisible : je le reconstruis.' % serie)
                      d, t = [], {}
                      if avant and isinstance(avant.get('date'), str) and avant['date'] < date:
                          d = [avant['date']]
                          anciennes = avant.get('a') or {}
                          for cid, v in (avant.get('t') or {}).items():
                              if cid.startswith(serie + '-') and cid in anciennes and isinstance(v, (int, float)) and v > 0:
                                  t[cid] = [int(round(v * 100))]
                  else:
                      d, t = h
                  if d and d[-1] > date:
                      print('Historique de %s : le fichier Cardmarket (%s) est plus ancien que le dernier relevé (%s), je n’y touche pas.' % (serie, date, d[-1]))
                      continue
                  if not d or d[-1] < date:
                      d.append(date)
                  k = len(d) - 1
                  auj = par[serie]
                  for cid in set(t) | set(auj):
                      col = t.get(cid, [])
                      col = col + [0] * (k + 1 - len(col))
                      col[k] = auj.get(cid, 0)
                      t[cid] = col
                  if len(d) > JOURS_MAX:
                      coupe = len(d) - JOURS_MAX
                      d = d[coupe:]
                      t = {cid: col[coupe:] for cid, col in t.items()}
                  t = {cid: col for cid, col in t.items() if any(col)}
                  texte = json.dumps({'v': 1, 'e': serie, 'd': d, 't': {cid: t[cid] for cid in sorted(t)}},
                                     ensure_ascii=False, separators=(',', ':')) + '\n'
                  try:
                      with open(chemin, encoding='utf-8') as f:
                          if f.read() == texte:
                              continue
                  except OSError:
                      pass
                  tmp = chemin + '.tmp'
                  with open(tmp, 'w', encoding='utf-8') as f:
                      f.write(texte)
                  os.replace(tmp, chemin)
                  ecrits += 1
              print('Historique : %d série(s) mise(s) à jour dans %s' % (ecrits, dossier_h))


          def main():
              guide = lire('price_guide_%d.json' % JEU, URL_PRIX)
              produits = lire('products_singles_%d.json' % JEU, URL_PRODUITS)
              G = {g['idProduct']: g for g in guide.get('priceGuides', []) if 'idProduct' in g}
              liste = produits.get('products', [])
              if len(G) < 1000 or len(liste) < 1000:
                  echec('fichiers Cardmarket incomplets (%d prix, %d produits)' % (len(G), len(liste)))
              m = re.match(r'(\d{4}-\d{2}-\d{2})', str(guide.get('createdAt', '')))
              if not m:
                  echec('date introuvable dans le fichier de prix')
              date = m.group(1)

              # série -> extension -> numéro -> [idProduct] (l'ordre des idProduct donne l'ordre des versions)
              rx = re.compile(r'\((FB\d\d)-(\d+)\)')
              par = collections.defaultdict(lambda: collections.defaultdict(lambda: collections.defaultdict(list)))
              for p in liste:
                  mm = rx.search(html.unescape(p.get('name', '')))
                  if mm and 'idProduct' in p and 'idExpansion' in p:
                      par[mm.group(1)][p['idExpansion']][mm.group(2)].append(p['idProduct'])

              t, a = {}, {}
              for serie, exts in par.items():
                  if serie in EXTENSIONS:
                      ordre = [e for e in EXTENSIONS[serie] if e in exts]
                  else:
                      taille = {e: sum(len(v) for v in exts[e].values()) for e in exts}
                      ordre = sorted((e for e in exts if taille[e] >= 0.7 * max(taille.values())), reverse=True)
                  for num in sorted({n for e in ordre for n in exts[e]}):
                      for i, suf in enumerate(SUFFIXES):
                          for e in ordre:
                              ids = sorted(exts[e].get(num, []))
                              if len(ids) <= i:
                                  continue
                              g = G.get(ids[i])
                              v, src = meilleur(g)
                              if v is None:
                                  continue
                              cid = '%s-%s%s' % (serie, num, suf)
                              t[cid] = round(v, 2)
                              if src in ('trend', 'trend-foil'):
                                  f = '-foil' if src.endswith('-foil') else ''
                                  a[cid] = [round(g.get(k + f) or 0, 2) for k in ('avg30', 'avg7', 'avg1')]
                              break

              if len(t) < 1000:
                  echec('trop peu de prix reconnus (%d) : je n’écris rien' % len(t))
              try:
                  with open(SORTIE, encoding='utf-8') as f:
                      prec = json.load(f)
                  avant = len(prec.get('t', {}))
              except Exception:
                  prec, avant = None, 0
              if avant and len(t) < 0.9 * avant:
                  echec('seulement %d prix reconnus contre %d dans le fichier actuel : je n’écrase rien' % (len(t), avant))

              sortie = {'v': 1, 'date': date, 'n': len(t), 't': {k: t[k] for k in sorted(t)}, 'a': {k: a[k] for k in sorted(a)}}
              texte = json.dumps(sortie, ensure_ascii=False, separators=(',', ':')) + '\n'
              dossier = os.path.dirname(SORTIE)
              if dossier:
                  os.makedirs(dossier, exist_ok=True)
              tmp = SORTIE + '.tmp'
              with open(tmp, 'w', encoding='utf-8') as f:
                  f.write(texte)
              os.replace(tmp, SORTIE)
              print('OK : %d prix (dont %d avec moyennes), prix du %s -> %s' % (len(t), len(a), date, SORTIE))
              maj_historique(dossier, date, {cid: t[cid] for cid in a}, prec if isinstance(prec, dict) else None)


          if __name__ == '__main__':
              main()
          PYEOF

      - name: Enregistrer les nouveaux prix
        run: |
          git add docs/prix.json docs/hist
          if git diff --cached --quiet; then
            echo "Les prix sont déjà à jour."
          else
            DATE=$(python3 -c "import json;print(json.load(open('docs/prix.json'))['date'])")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Prix Cardmarket du $DATE"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
