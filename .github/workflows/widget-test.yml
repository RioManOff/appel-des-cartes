name: Test du widget (émulateur)
on:
  push:
    branches: [widget]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install && npm uninstall --no-save @capacitor/push-notifications
      - name: Appli légère
        run: |
          mkdir -p www && cp docs/manifest.json www/ 2>/dev/null || true
          printf '<!doctype html><meta charset="utf-8"><title>test</title><meta http-equiv="refresh" content="0;url=https://riomanoff.github.io/appel-des-cartes/">' > www/index.html
          python3 -c "import json;p='capacitor.config.json';c=json.load(open(p));c['webDir']='www';json.dump(c,open(p,'w'),ensure_ascii=False)"
      - run: npx cap add android
      - run: npx cap sync android
      - run: python3 android-config/widget/install.py --test
      - name: Compiler l'appli et le test
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-config/widget/emutest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-test
          path: out/
      - name: Résultats sur la branche tmp-widget
        if: always()
        run: |
          cd out && rm -f logcat_complet.txt && git init -q && git checkout -q -b tmp-widget && git add . && git -c user.name=bot -c user.email=bot@x commit -qm test && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-widget
