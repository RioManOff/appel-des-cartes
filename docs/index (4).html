function art(c){return `<div class="art r-${c.type==='Leader'?'L':'U'} ${c.own?'':'miss'}" >${CARDIMG[c.id]?`<img class="cimg" src="${CARDIMG[c.id]}" alt="${esc(c.name||c.id)}" draggable="false">`:SPH[c.id]?`<img class="cimg" loading="lazy" src="${SPH[c.id]}" alt="${esc(c.name||c.id)}" draggable="false">`:p3(c.n)}${c.ver!=='Normal'?'<em>ALT</em>':''}${c.own>1?`<span class="qty">×${c.own}</span>`:''}</div>`}
function cardBtn(c){return `<div class="tile"><button class="card" data-n="${c.id}" aria-label="${c.id}" style="width:100%">${art(c)}<div class="meta">${c.name||'<span>Nom à compléter</span>'}<br><span>${c.id}</span></div></button>${X.fav[c.id]?'<span class="mk">⭐</span>':''}${X.sell[c.id]?'<span class="mk s">💱</span>':''}${X.upg[c.id]?'<span class="mk u">🔧</span>':''}<button class="adj m" data-cq="${c.id}" data-cd="-1" aria-label="Retirer une carte">−</button><button class="adj p" data-cq="${c.id}" data-cd="1" aria-label="Ajouter une carte">+</button></div>`}
const header=()=>`<header><div><h1>🐉 L'Appel des Cartes</h1><div class="sub">${S.tab==='coll'||S.tab==='scan'?S.ext+' · '+EXTS.find(x=>x[0]===S.ext)[1]:'FB01 → FB05'}</div></div></header>`;
function sealed(){const e=S.ext,tot=SEALT.reduce((a,t)=>a+sl(e,t[0]).own,0);
return header()+`<button class="btn alt" style="margin-bottom:8px;text-align:left" data-pick>📚 Série : <b>${e} · ${EXTS.find(x=>x[0]===e)[1]}</b> ▾</button>${modeBar()}<div class="panel">Produits scellés de la série : <b>${tot}</b> possédé${tot>1?'s':''} non ouvert${tot>1?'s':''} · investi : <b>${eur(X.buys.filter(b=>b.ext===e).reduce((a,b)=>a+b.q*nb(b.p),0))}</b></div><div class="grid">${SEALT.map(t=>sealTile(e,t)).join('')}</div><p class="sub">Touche un produit pour régler les quantités.</p>`}

return header()+`<h2>Doublons</h2><div class="panel"><b>${ex}</b> exemplaire${ex>1?'s':''} en trop sur <b>${l.length}</b> carte${l.length>1?'s':''}<div class="sub">Au-delà de 3 exemplaires (le maximum utile en jeu), pour échanger ou vendre.</div></div>`+(l.map(c=>`<button class="panel ext" data-n="${c.id}" style="margin-top:10px"><b>${c.id}</b> ${c.name}${c.ver!=='Normal'?' · Alt Art':''}<span class="n">×${c.own}</span><div class="sub">${c.own-3} en trop${c.rar?' · '+c.rar:''}</div></button>`).join('')||'<p class="sub">Aucune carte en plus de 3 exemplaires pour le moment.</p>')}
function luckDraw(F){F=F||{};const pool=cards.filter(c=>c.ext===S.ext),out=[];
const pk=(rar,alt)=>{let l=pool.filter(c=>(alt?c.ver!=='Normal':c.ver==='Normal')&&c.rar===rar);if(!l.length)l=pool.filter(c=>c.ver==='Normal'&&c.rar===rar);if(!l.length)l=pool.filter(c=>c.ver==='Normal');return l[Math.floor(Math.random()*l.length)].id};
const pa=(rar)=>{const l=pool.filter(c=>c.ver!=='Normal'&&c.rar===rar);return l.length?pk(rar,true):pk(rar,false)};
/* Paquet jap : 6 cartes. Taux estimés (observations communautaires, ~1152 paquets) */
out.push(pk('C'),pk('C'));
out.push(Math.random()<.1?pk('L'):pk('C'));
out.push(pk('UC'));
out.push(F.ralt||(F.hit===undefined&&Math.random()<.042)?pa('R'):pk('R'));
const r=Math.random()*100;let h;
if(F.hit){const k=F.hit;h=k==='SRn'?pk('SR'):k==='SRa'?pa('SR'):k==='SCRn'?pk('SCR'):k==='SCRa'?pa('SCR'):k==='La'?pa('L'):pk(Math.random()<.35?'R':'UC')}else if(r<.3)h=pa('SCR');else if(r<1.3)h=pk('SCR');else if(r<2)h=pa('L');else if(r<4.8)h=pa('SR');else if(r<21.5)h=pk('SR');else h=pk(Math.random()<.35?'R':'UC');
out.push(h);
return {ext:S.ext,ids:out,rev:out.map(()=>false),nw:out.map((id,i)=>cards.find(c=>c.id===id).own===0&&out.indexOf(id)===i),added:false}}
const vdone=(e)=>cards.filter(c=>c.ext===e).every(c=>VIRT.q[c.id]>0);
const celeb=(e)=>`<div class="panel" style="margin-top:14px;text-align:center;border:2px solid var(--ac)"><div style="font-size:40px">🏆🎉</div><b>Bravo ! Série ${e} · ${EXTS.find(x=>x[0]===e)[1]} complétée en virtuel !</b><div class="sub">Tu as obtenu les ${cards.filter(c=>c.ext===e).length} cartes, Alt Art comprises, en ${VIRT.b} boosters ouverts.</div></div>`;
function boxView(b){const cnt={},nwc=b.nw.filter(Boolean).length;b.ids.forEach(id=>{const c=cards.find(x=>x.id===id),k=c.rar+(c.ver==='Normal'?'':' Alt');cnt[k]=(cnt[k]||0)+1});
const order=['SCR Alt','SCR','L Alt','SR Alt','SR','R Alt','L','R','UC','C'],ks=Object.keys(cnt).sort((a,c)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(c)<0?99:order.indexOf(c)));
const hit=[...new Set(b.ids)].map(id=>cards.find(x=>x.id===id)).filter(c=>c.ver!=='Normal'||c.rar==='SR'||c.rar==='SCR').sort((a,c)=>(order.indexOf(a.rar+(a.ver==='Normal'?'':' Alt'))+0)-(order.indexOf(c.rar+(c.ver==='Normal'?'':' Alt'))+0));

function boxDraw(){const hits=['SRn','SRn','SRn','SRn'],x=Math.random();
if(x<.667)hits.push('SRa');else if(x<.75)hits.push('SCRn');else if(x<.917)hits.push('SCRn','La');else hits.push('SCRa');
while(hits.length<24)hits.push('x');
for(let i=hits.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[hits[i],hits[j]]=[hits[j],hits[i]]}
const ra=Math.floor(Math.random()*24),ids=[];hits.forEach((h,i)=>{const o={hit:h,ralt:i===ra};if(h==='SCRn'&&hits.filter(z=>z==='SCRn').length>0){}ids.push(...luckDraw(o).ids)});

function caseDraw(){const ids=[];for(let i=0;i<12;i++)ids.push(...boxDraw().ids);return {ext:S.ext,ids,nw:[],box:true,n:12}}

const cardBack=()=>`<div class="art" style="background:none;border:0;padding:0;opacity:1;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.55)"><img src="${BACKIMG}" alt="Dos de carte" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
function packStage(o,pk,E){const n=pk.ids.length,j=pk.i;
if(j>=n){const nwn=pk.nw.filter(Boolean).length;return (S.celeb===E?celeb(E):'')+`<div class="grid" style="margin-top:6px">${pk.ids.map((id,k)=>{const c=cards.find(x=>x.id===id),hot=c.rar==='SCR'||c.rar==='SR'||c.ver!=='Normal';return `<div class="tile flip ${c.rar==='SCR'?'scr':hot?'holo':''}" style="animation-delay:${k*.08}s${hot?';filter:drop-shadow(0 0 9px #ffc83d)':''}"><button class="card" style="width:100%">${art({...c,own:VIRT.q[id]||0})}${pk.nw[k]?'<span class="nw">NOUVELLE</span>':''}<div class="meta">${c.name}<br><span>${id}${c.rar?' · '+c.rar:''}</span></div></button></div>`}).join('')}</div><div class="panel" style="margin-top:12px"><b>${nwn}</b> nouvelle${nwn>1?'s':''} carte${nwn>1?'s':''} sur ${n}</div>`}
const id=pk.ids[j],c=cards.find(x=>x.id===id),sh=pk.rev[j],hot=c.rar==='SCR'||c.rar==='SR'||c.ver!=='Normal';
return `<div class="dots">${pk.ids.map((x,k)=>`<i class="${k<j||(k===j&&sh)?'on':''} ${k===j?'cur':''}"></i>`).join('')}</div>
<button class="stage ${sh?'':'sback'}" ${sh?'data-nx':`data-lr="${j}"`} aria-label="${sh?'Carte suivante':'Retourner la carte'}">${sh?`<div class="cf ${c.rar==='SCR'?'scr':hot?'holo':''}" ${hot?'style="filter:drop-shadow(0 0 16px #ffc83d)"':''}><div class="tilt" data-rare="${hot?1:0}">${art({...c,own:VIRT.q[id]||0})}</div>${pk.nw[j]?'<span class="nw" style="font-size:13px">NOUVELLE</span>':''}</div><div class="meta" style="margin-top:10px;font-size:17px"><b>${c.name}</b><br><span>${id}${c.rar?' · '+c.rar:''}</span></div>`:`<div class="cf slin">${cardBack()}</div><div class="meta" style="margin-top:10px">Touche pour retourner</div>`}</button>
<div class="sub" style="text-align:center">${sh?(j<n-1?'Touche la carte pour passer à la suivante':'Touche la carte pour voir le résumé'):'Carte '+(j+1)+' / '+n}</div><div style="text-align:center"><button class="chip" data-lall>⏭ Tout révéler</button></div>`}
function opView(){const o=S.op,E=o.ext,nm=EXTS.find(x=>x[0]===E)[1];let h=header()+`<h2>${o.duel?'⚔️ Duel · ':'🎲 '}${o.kind==='case'?'Case':o.kind==='box'?'Display':'Booster'} ${E} · ${nm}</h2>`;
if(o.cur!==null){const pk=o.packs[o.cur],i=o.cur;
h+=`<button class="btn alt" style="margin-bottom:8px;text-align:left" data-pback>← ${o.kind==='pack'?'Mode hasard':'Retour aux boosters'}</button>`;
if(!pk.st){h+=`<div class="packbig" data-ptear="${i}" style="position:relative;width:100%;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;padding:10px 0"><div class="art floaty" style="background:none;border-color:transparent;aspect-ratio:auto;padding:10px 0;pointer-events:none">${pimg(PACKIMG[E],"Booster",'height:300px;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));-webkit-user-drag:none')}</div><div class="meta"><b>✂️ Coupe le haut du paquet : glisse ton doigt d'un côté à l'autre</b></div></div><button class="chip" style="margin-top:8px" data-pdo="${i}">Ouvrir sans glisser</button>`}
else{if(pk.i===undefined)pk.i=pk.rev.every(Boolean)?pk.ids.length:0;h+=packStage(o,pk,E);
if(o.kind!=='pack'){const lo=Math.floor(i/24)*24,hi=lo+23;h+=`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn alt" data-pgo="${Math.max(lo,i-1)}" ${i<=lo?'disabled style="opacity:.4"':''}>← Précédent</button><button class="btn" data-pgo="${Math.min(hi,i+1)}" ${i>=hi?'disabled style="opacity:.4"':''}>Suivant →</button></div>`}
else h+=o.duel?(pk.i>=pk.ids.length?duelPanel(o)+dlBtn(o):''):(pk.i>=pk.ids.length?`<button class="btn" style="margin-top:10px" data-oi="pack">🎲 Ouvrir un autre booster</button>`:'')}
return h}
if(o.kind==='pack')return h;
if(o.kind==='case'&&o.disp===null){h+=`<button class="btn alt" style="margin-bottom:8px;text-align:left" data-oback>← Mode hasard</button><div class="panel">Choisis un display à ouvrir (12 par case).</div><div class="grid" style="margin-top:10px">${Array.from({length:12},(_,k)=>{const sl=o.packs.slice(k*24,k*24+24),n=sl.filter(x=>x.st).length;return `<button class="card" data-dgo="${k}" style="width:100%"><div class="art" style="background:none;border-color:transparent;${n===24?'opacity:.55':''}">${pimg(DISPIMG[o.ext],'Display')}${n===24?'<em>✅ terminé</em>':''}</div><div class="meta">Display ${k+1}<br><span>${n} / 24 ouverts</span></div></button>`}).join('')}</div><button class="btn" style="margin-top:12px" data-pall="all">⚡ Ouvrir tous les displays</button>`;return h+(o.packs.every(x=>x.st)?(o.duel?duelPanel(o)+dlBtn(o):`<button class="btn" style="margin-top:12px" data-oi="case">🔁 Ouvrir une autre case ${E}</button>`):'')+opSummary(o)}
const k=o.kind==='case'?o.disp:0,lo=k*24;
h+=`<button class="btn alt" style="margin-bottom:8px;text-align:left" ${o.kind==='case'?'data-dback>← Retour à la case':'data-oback>← Mode hasard'}</button><div class="panel">${o.kind==='case'?'Display '+(k+1)+' · ':''}${o.packs.slice(lo,lo+24).filter(x=>x.st).length} / 24 boosters ouverts<div class="sub">Touche un booster pour l'ouvrir et révéler ses cartes une par une.</div></div><div class="grid" style="margin-top:10px">${Array.from({length:24},(_,j)=>packTile(o,lo+j)).join('')}</div><button class="btn" style="margin-top:12px" data-pall="${k}">⚡ Ouvrir tous les boosters du display</button>`;
return h+(o.kind==='box'&&o.packs.every(x=>x.st)?(o.duel?duelPanel(o)+dlBtn(o):`<button class="btn" style="margin-top:12px" data-oi="box">🔁 Ouvrir un autre display ${E}</button>`):'')+(S.celeb===E?celeb(E):'')+opSummary(o)}
function luck(){if(S.hzv)return virtView();if(S.op)return opView();if(S.dl)return duelView();if(S.shop)return shopView();
return header()+`<h2>🎲 Mode hasard</h2><div class="panel">Ouvre des boosters virtuels de 6 cartes (comme un paquet japonais). Les cartes vont uniquement dans ta collection virtuelle, jamais dans ta vraie collection. <div class="sub">Taux estimés d'après des observations de la communauté (Bandai ne les publie pas).</div></div><button class="btn alt" style="margin:10px 0;text-align:left" data-pick>📚 Série : <b>${S.ext} · ${EXTS.find(x=>x[0]===S.ext)[1]}</b> ▾</button><button class="btn" data-oi="pack">${pimg(PACKIMG[S.ext],'',"height:34px;vertical-align:middle;margin-right:8px")}Ouvrir un booster ${S.ext}</button><button class="btn" style="margin-top:8px" data-oi="box">${pimg(DISPIMG[S.ext],'',"height:34px;vertical-align:middle;margin-right:8px")}Ouvrir un display ${S.ext} (24 boosters)</button><button class="btn" style="margin-top:8px" data-oi="case">${pimg(CASEIMG,'',"height:34px;vertical-align:middle;margin-right:8px")}Ouvrir une case ${S.ext} (12 displays)</button><button class="btn" style="margin-top:8px" data-dl>⚔️ Duel de boosters</button><button class="btn" style="margin-top:8px" data-shop>🛒 Boutique virtuelle (${VIRT.pts||0} pts)</button><button class="btn alt" style="margin-top:8px" data-vopen>📚 Collection virtuelle (${Object.keys(VIRT.q).length} cartes différentes)</button>`+(S.celeb===S.ext?celeb(S.ext):'')}

function sbPanel(){if(!sbOn())return '';const inp='width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;margin-top:6px';
if(!SBS)return `<div class="panel" style="margin-bottom:10px">👤 Compte<div class="sub">Retrouve ta collection sur tous tes appareils.</div><input id="sb-e" type="email" autocomplete="email" placeholder="Adresse e-mail" style="${inp}"><input id="sb-p" type="password" autocomplete="current-password" placeholder="Mot de passe (6 caractères minimum)" style="${inp}"><button class="btn" style="margin-top:8px" data-sbin>Se connecter</button><button class="btn alt" style="margin-top:8px" data-sbup>Créer un compte</button>${SBMSG?`<div class="sub" style="margin-top:8px">${esc(SBMSG)}</div>`:''}</div>`;
return `<div class="panel" style="margin-bottom:10px">👤 Compte<div class="sub">Connecté : <b>${esc(SBS.email)}</b></div><div class="sub" style="margin-top:4px">${esc(SBMSG||(SBAUTO?'Synchronisation automatique activée':''))}</div><button class="btn alt" style="margin-top:8px" data-sbpull>⬇️ Charger la collection du compte</button><button class="btn alt" style="margin-top:8px" data-sbpush>⬆️ Envoyer cet appareil vers le compte</button><button class="chip" style="margin-top:8px" data-sbout>Se déconnecter</button></div>`}

/* ===== Photos partagées (Supabase Storage) ===== */
let SPH={};try{SPH=JSON.parse(localStorage.getItem('fb_sph')||'{}')}catch(e){}
const sphUrl=(id,v)=>SBC.url+'/storage/v1/object/public/card-photos/'+encodeURIComponent(id)+'.jpg?v='+(v||0);
async function sphLoad(){if(!sbOn())return;try{let all=[],off=0;for(let k=0;k<5;k++){const t=SBS?await sbTok():null,h={apikey:SBC.key,'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;const r=await fetch(SBC.url+'/storage/v1/object/list/card-photos',{method:'POST',headers:h,body:JSON.stringify({prefix:'',limit:1000,offset:off,sortBy:{column:'name',order:'asc'}})});if(!r.ok)return;const a=await r.json();all=all.concat(a);if(a.length<1000)break;off+=1000}
const m={};all.forEach(o=>{if(o&&o.name&&/\.jpg$/.test(o.name)){const id=o.name.replace(/\.jpg$/,'');m[id]=sphUrl(id,Date.parse(o.updated_at||o.created_at||0)||1)}});
if(JSON.stringify(m)!==JSON.stringify(SPH)){SPH=m;try{localStorage.setItem('fb_sph',JSON.stringify(m))}catch(e){}render()}}catch(e){}}
function sphBlob(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.82)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
async function sphUp(f,id){if(!f||!id)return;if(!SBS){toast('Connecte-toi dans Réglages pour ajouter une photo');return}toast('Envoi de la photo…');try{const b=await sphBlob(f),t=await sbTok(),r=await fetch(SBC.url+'/storage/v1/object/card-photos/'+encodeURIComponent(id)+'.jpg',{method:'POST',headers:{apikey:SBC.key,Authorization:'Bearer '+t,'Content-Type':'image/jpeg','x-upsert':'true'},body:b});if(!r.ok){toast(r.status===400||r.status===403?'Cette carte a déjà une photo d\'un autre utilisateur':'Envoi impossible');return}SPH[id]=sphUrl(id,Date.now());try{localStorage.setItem('fb_sph',JSON.stringify(SPH))}catch(e){}toast('Photo ajoutée, tout le monde la voit ✓');render()}catch(e){toast('Envoi impossible')}}
async function sphDel(id){if(!SBS||!id)return;try{const t=await sbTok(),r=await fetch(SBC.url+'/storage/v1/object/card-photos/'+encodeURIComponent(id)+'.jpg',{method:'DELETE',headers:{apikey:SBC.key,Authorization:'Bearer '+t}});if(!r.ok){toast('Tu ne peux retirer que tes propres photos');return}await sphLoad();delete SPH[id];render();toast('Photo retirée')}catch(e){toast('Retrait impossible')}}
if(sbOn()){sphLoad();addEventListener('focus',()=>sphLoad())}
phLoad();render();
</script>
<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
